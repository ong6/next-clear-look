openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Next Clear Look Engine API
  version: 1.0.0
  summary: Sentinel-2 geometric opportunities, AOI archive evidence and historical likelihoods.
  description: |
    HTTP contract between the engine and the web app. An opportunity is geometry, not promised acquisition.
    A likelihood is empirical history, not a weather forecast. All instants are aware UTC RFC 3339.
servers:
  - url: http://localhost:8000/v1
    description: Local engine
tags:
  - name: System
  - name: AOIs
  - name: Satellites
  - name: Opportunities
  - name: Scenes
  - name: Likelihood
  - name: Provenance
  - name: Jobs
  - name: Streams

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness, readiness and source-mode health.
      responses:
        '200':
          description: Engine is ready to serve its current mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                singapore:
                  externalValue: ./examples/health.json
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /mode:
    get:
      tags: [System]
      operationId: getMode
      summary: Read the active source mode and effective clock.
      responses:
        '200':
          description: Current mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
              examples:
                replay:
                  externalValue: ./examples/mode-replay.json
                live:
                  externalValue: ./examples/mode-live.json
    put:
      tags: [System]
      operationId: switchMode
      summary: Switch source adapter and clock when no job is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeSwitchRequest'
            examples:
              live:
                externalValue: ./examples/mode-switch-live.json
      responses:
        '200':
          description: Mode changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
              examples:
                live:
                  externalValue: ./examples/mode-live.json
        '409':
          description: Live mode is disabled, jobs are active, or the fixture set cannot be loaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                live_disabled:
                  externalValue: ./examples/error-live-disabled.json
        '422':
          $ref: '#/components/responses/ValidationError'

  /attributions:
    get:
      tags: [System]
      operationId: listAttributions
      summary: Get display-ready source and terms attribution required by the data providers.
      responses:
        '200':
          description: Source attributions for the active engine build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionList'
              examples:
                sources:
                  externalValue: ./examples/attributions.json

  /aois:
    get:
      tags: [AOIs]
      operationId: listAois
      summary: List saved AOIs.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: AOI page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AoiPage'
              examples:
                saved:
                  externalValue: ./examples/aoi-page.json
    post:
      tags: [AOIs]
      operationId: createAoi
      summary: Validate, canonicalise and save a Polygon or MultiPolygon.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AoiCreate'
            examples:
              singapore:
                externalValue: ./examples/aoi-create.json
      responses:
        '201':
          description: AOI created.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aoi'
              examples:
                singapore:
                  externalValue: ./examples/aoi.json
        '409':
          description: Idempotency key was reused with different content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /aois/{aoi_id}:
    parameters:
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [AOIs]
      operationId: getAoi
      summary: Get one AOI.
      responses:
        '200':
          description: AOI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aoi'
              examples:
                singapore:
                  externalValue: ./examples/aoi.json
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [AOIs]
      operationId: updateAoi
      summary: Rename or replace AOI geometry; geometry changes invalidate derived cache keys.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AoiPatch'
            examples:
              rename:
                externalValue: ./examples/aoi-patch.json
      responses:
        '200':
          description: Updated AOI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aoi'
              examples:
                singapore:
                  externalValue: ./examples/aoi.json
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [AOIs]
      operationId: deleteAoi
      summary: Delete an AOI and its unpinned derived records.
      responses:
        '204':
          description: Deleted; no response body.
        '404':
          $ref: '#/components/responses/NotFound'

  /satellites:
    get:
      tags: [Satellites]
      operationId: listSatellites
      summary: List Sentinel-2 spacecraft reconciled across OMM and STAC evidence.
      responses:
        '200':
          description: Satellite list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatellitePage'
              examples:
                singapore:
                  externalValue: ./examples/satellites.json

  /satellites/{satellite_id}:
    parameters:
      - $ref: '#/components/parameters/SatelliteId'
    get:
      tags: [Satellites]
      operationId: getSatellite
      summary: Get current catalogue evidence for one satellite.
      responses:
        '200':
          description: Satellite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Satellite'
              examples:
                sentinel_2c:
                  externalValue: ./examples/satellite.json
        '404':
          $ref: '#/components/responses/NotFound'

  /satellites/{satellite_id}/trajectory:
    parameters:
      - $ref: '#/components/parameters/SatelliteId'
    get:
      tags: [Satellites]
      operationId: getTrajectory
      summary: Get compact geodetic samples for client-side interpolation.
      parameters:
        - name: start
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Timestamp'}
        - name: end
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Timestamp'}
        - name: step_seconds
          in: query
          schema: {type: integer, minimum: 10, maximum: 600, default: 60}
      responses:
        '200':
          description: Sampled trajectory.
          headers:
            X-Provenance-Id:
              $ref: '#/components/headers/ProvenanceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trajectory'
              examples:
                singapore:
                  externalValue: ./examples/trajectory.json
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /aois/{aoi_id}/opportunities:
    parameters:
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [Opportunities]
      operationId: listOpportunities
      summary: List geometric Sentinel-2 opportunities for an AOI.
      description: >-
        These are geometric opportunities and do not promise acquisition. When from and to are
        omitted, the window starts at the engine clock and ends 14 days later. Supply both values
        to request a different window.
      parameters:
        - name: from
          in: query
          description: Inclusive window start. Must be supplied together with to.
          schema: {$ref: '#/components/schemas/Timestamp'}
        - name: to
          in: query
          description: Exclusive window end. Must be supplied together with from.
          schema: {$ref: '#/components/schemas/Timestamp'}
        - name: satellite_id
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Opportunity page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
              examples:
                singapore:
                  externalValue: ./examples/opportunities.json
        '202':
          description: Analysis is not cached and has been queued.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                pending:
                  externalValue: ./examples/analysis-job.json
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /aois/{aoi_id}/scenes:
    parameters:
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [Scenes]
      operationId: listScenes
      summary: List intersecting archive scenes and AOI-level statistics when available.
      description: Defaults to the half-open archive window [clock minus 30 days, clock).
      parameters:
        - name: from
          in: query
          schema: {$ref: '#/components/schemas/Timestamp'}
        - name: to
          in: query
          schema: {$ref: '#/components/schemas/Timestamp'}
        - name: minimum_aoi_clear_percent
          in: query
          schema: {type: number, minimum: 0, maximum: 100}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Scene page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenePage'
              examples:
                singapore:
                  externalValue: ./examples/scenes.json
                empty_archive:
                  externalValue: ./examples/scenes-empty.json
                replay_not_recorded:
                  externalValue: ./examples/scenes-not-recorded.json
        '202':
          description: Archive search is pending; this is distinct from an empty completed archive.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                pending:
                  externalValue: ./examples/analysis-job.json
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scenes/{scene_id}:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      tags: [Scenes]
      operationId: getScene
      summary: Get STAC-derived scene metadata and engine resource links.
      responses:
        '200':
          description: Scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
              examples:
                singapore:
                  externalValue: ./examples/scene.json
        '404':
          $ref: '#/components/responses/NotFound'

  /scenes/{scene_id}/statistics/{aoi_id}:
    parameters:
      - $ref: '#/components/parameters/SceneId'
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [Scenes]
      operationId: getSceneStatistics
      summary: Get AOI-rasterised SCL statistics and class counts.
      responses:
        '200':
          description: AOI statistics.
          headers:
            X-Provenance-Id:
              $ref: '#/components/headers/ProvenanceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterStatistics'
              examples:
                singapore:
                  externalValue: ./examples/scene-statistics.json
        '202':
          description: Raster analysis queued.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                pending:
                  externalValue: ./examples/analysis-job.json
        '404':
          $ref: '#/components/responses/NotFound'

  /scenes/{scene_id}/thumbnails/{aoi_id}:
    parameters:
      - $ref: '#/components/parameters/SceneId'
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [Scenes]
      operationId: getSceneThumbnail
      summary: Get a true-colour PNG clipped to the AOI, transparent outside it.
      responses:
        '200':
          description: Clipped RGBA PNG.
          headers:
            ETag:
              schema: {type: string}
              description: Quoted SHA-256 of the PNG bytes.
            X-Provenance-Id:
              $ref: '#/components/headers/ProvenanceId'
            Cache-Control:
              schema: {type: string, example: 'public, max-age=31536000, immutable'}
          content:
            image/png:
              schema: {type: string, format: binary}
        '202':
          description: Thumbnail generation queued.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                pending:
                  externalValue: ./examples/analysis-job.json
        '404':
          $ref: '#/components/responses/NotFound'

  /scenes/{scene_id}/thumbnails/{aoi_id}/metadata:
    parameters:
      - $ref: '#/components/parameters/SceneId'
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [Scenes]
      operationId: getSceneThumbnailMetadata
      summary: Get thumbnail dimensions, checksum and lineage link.
      responses:
        '200':
          description: Thumbnail metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThumbnailMetadata'
              examples:
                singapore:
                  externalValue: ./examples/thumbnail-metadata.json
        '404':
          $ref: '#/components/responses/NotFound'

  /aois/{aoi_id}/likelihood:
    parameters:
      - $ref: '#/components/parameters/AoiId'
    get:
      tags: [Likelihood]
      operationId: getLikelihood
      summary: Get historical chance of at least one usable look in 7 and 14 days.
      description: Empirical historical likelihood; not weather forecasting or tasking.
      parameters:
        - name: as_of
          in: query
          schema: {$ref: '#/components/schemas/Timestamp'}
          description: Defaults to the active deterministic clock.
      responses:
        '200':
          description: Likelihood with posterior, interval and sample evidence.
          headers:
            X-Provenance-Id:
              $ref: '#/components/headers/ProvenanceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Likelihood'
              examples:
                singapore:
                  externalValue: ./examples/likelihood.json
                insufficient_data:
                  externalValue: ./examples/likelihood-insufficient.json
        '202':
          description: Likelihood analysis queued.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                pending:
                  externalValue: ./examples/analysis-job.json
        '404':
          $ref: '#/components/responses/NotFound'

  /provenance/{provenance_id}:
    parameters:
      - $ref: '#/components/parameters/ProvenanceId'
    get:
      tags: [Provenance]
      operationId: getProvenance
      summary: Resolve raw inputs, algorithms and lineage for a derived result.
      responses:
        '200':
          description: Directed acyclic provenance graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenanceGraph'
              examples:
                singapore:
                  externalValue: ./examples/provenance.json
        '404':
          $ref: '#/components/responses/NotFound'

  /analysis-jobs:
    get:
      tags: [Jobs]
      operationId: listAnalysisJobs
      summary: List jobs, newest first.
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/JobState'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
              examples:
                recent:
                  externalValue: ./examples/analysis-jobs.json
    post:
      tags: [Jobs]
      operationId: createAnalysisJob
      summary: Queue bounded, cancellable analysis work.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisJobCreate'
            examples:
              full_analysis:
                externalValue: ./examples/analysis-job-create.json
      responses:
        '202':
          description: Accepted, or an identical existing job was returned.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                singapore:
                  externalValue: ./examples/analysis-job.json
        '409':
          description: Idempotency conflict or incompatible mode.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /analysis-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: getAnalysisJob
      summary: Get durable job state and terminal result/error.
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                completed:
                  externalValue: ./examples/analysis-job-completed.json
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Jobs]
      operationId: cancelAnalysisJob
      summary: Idempotently request cancellation.
      responses:
        '202':
          description: Cancellation requested or job already cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
              examples:
                cancelling:
                  externalValue: ./examples/analysis-job-cancelling.json
        '409':
          description: Job already reached a non-cancelled terminal state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /analysis-jobs/{job_id}/events:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/LastEventIdQuery'
    get:
      tags: [Streams]
      operationId: streamAnalysisJobEvents
      summary: Resumeable per-job progress, warning, partial-result and terminal events.
      parameters:
        - $ref: '#/components/parameters/LastEventIdHeader'
      responses:
        '200':
          description: SSE stream. Schemas and ordering are normative in events.md.
          headers:
            Cache-Control:
              schema: {type: string, const: no-cache}
            X-Accel-Buffering:
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              schema: {type: string}
              examples:
                replay:
                  externalValue: ./examples/job-events.sse
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Requested event is older than retained job history.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events:
    get:
      tags: [Streams]
      operationId: streamLiveEvents
      summary: Resumeable mode clock, satellite-position, opportunity and new-scene events.
      parameters:
        - $ref: '#/components/parameters/LastEventIdHeader'
        - $ref: '#/components/parameters/LastEventIdQuery'
        - name: aoi_id
          in: query
          schema: {type: string}
          description: Optional AOI filter for opportunity/scene events.
      responses:
        '200':
          description: SSE live/replay stream; see events.md.
          content:
            text/event-stream:
              schema: {type: string}
              examples:
                replay:
                  externalValue: ./examples/live-events.sse

components:
  parameters:
    AoiId:
      name: aoi_id
      in: path
      required: true
      schema: {type: string, pattern: '^aoi_[A-Za-z0-9_-]+$'}
    SatelliteId:
      name: satellite_id
      in: path
      required: true
      schema: {type: string, enum: [sentinel-2a, sentinel-2b, sentinel-2c]}
    SceneId:
      name: scene_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    ProvenanceId:
      name: provenance_id
      in: path
      required: true
      schema: {type: string, pattern: '^prv_[A-Za-z0-9_-]+$'}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, pattern: '^job_[A-Za-z0-9_-]+$'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      schema: {type: string, maxLength: 200}
    LastEventIdQuery:
      name: last_event_id
      in: query
      required: false
      schema: {type: string, maxLength: 200}
      description: Browser-compatible fallback when a client cannot set Last-Event-ID; header wins.

  headers:
    ProvenanceId:
      schema: {type: string, pattern: '^prv_[A-Za-z0-9_-]+$'}
      description: Lineage graph for the returned representation.

  responses:
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              externalValue: ./examples/error.json
    ValidationError:
      description: Request syntax was valid but one or more values failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: The bounded job queue is full or a source rate limit applies.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Engine is live but not ready in its selected mode.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-10-02T17:43:54Z']

    GeoJsonGeometry:
      oneOf:
        - $ref: '#/components/schemas/GeoJsonPolygon'
        - $ref: '#/components/schemas/GeoJsonMultiPolygon'

    Position:
      type: array
      prefixItems:
        - {type: number, minimum: -180, maximum: 180}
        - {type: number, minimum: -90, maximum: 90}
      minItems: 2
      maxItems: 2

    LinearRing:
      type: array
      items: {$ref: '#/components/schemas/Position'}
      minItems: 4

    GeoJsonPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, const: Polygon}
        coordinates:
          type: array
          items: {$ref: '#/components/schemas/LinearRing'}
          minItems: 1

    GeoJsonMultiPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, const: MultiPolygon}
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items: {$ref: '#/components/schemas/LinearRing'}

    Bbox:
      type: array
      prefixItems:
        - {type: number}
        - {type: number}
        - {type: number}
        - {type: number}
      minItems: 4
      maxItems: 4

    GeoJsonPoint:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: {type: string, const: Point}
        coordinates: {$ref: '#/components/schemas/Position'}

    AoiPreset:
      type: object
      additionalProperties: false
      required: [slug, locality, story, climate_tags]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        locality: {type: string}
        story: {type: string}
        climate_tags:
          type: array
          items: {type: string}

    ReplayCoverage:
      type: object
      additionalProperties: false
      required: [opportunities, archive, likelihood, thumbnails]
