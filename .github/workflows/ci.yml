name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HYPOTHESIS_PROFILE: ci
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1790985600"
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@1e60f620b9541d1603c39534d3a2b7b639f1a590
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install uv
        run: python -m pip install uv==0.8.0
      - name: Locked dependencies and browser
        run: make bootstrap-test
      - name: G1-G17
        run: make ci
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ncl-gate-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .coverage*
            htmlcov/
            playwright-report/
            test-results/
            .local/reports/
