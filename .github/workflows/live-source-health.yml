name: Live source health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-source-health
  cancel-in-progress: false

jobs:
  earth-search:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install locked engine environment
        run: |
          python -m pip install uv==0.8.0
          uv sync --project engine --frozen --all-groups
      - name: One bounded catalogue probe
        env:
          NCL_ALLOW_LIVE: "1"
        run: uv run --project engine python tools/live_source_health.py
