[project]
name = "ncl-engine"
version = "0.1.0"
description = "Next Clear Look analysis engine"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.118.0",
  "numpy==2.3.3",
  "pillow==11.3.0",
  "pydantic==2.11.9",
  "pyproj==3.7.2",
  "rasterio==1.4.3",
  "sgp4==2.25",
  "shapely==2.1.2",
  "skyfield==1.53",
  "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "hypothesis==6.140.3",
  "httpx==0.28.1",
  "mypy==1.18.2",
  "openapi-spec-validator==0.7.2",
  "pyyaml==6.0.3",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-cov==7.0.0",
  "pytest-socket==0.7.0",
  "ruff==0.13.3",
  "types-jsonschema==4.25.1.20251009",
  "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ncl_engine"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ncl_engine", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*", "skyfield.*", "sgp4.*", "pyproj.*", "PIL.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ncl_engine"]
